services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: criacerto-db
    ports:
      - "${DB_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Password123!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - criacerto-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: criacerto-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - criacerto-network
    restart: always

  api:
    build:
      context: .
      dockerfile: src/Host/CriaCerto.Api/Dockerfile
    container_name: criacerto-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=CriaCertoDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET:-SuperSecretJwtKeyForCriaCertoProduction123!}"
      JwtSettings__Issuer: "CriaCerto.Api"
      JwtSettings__Audience: "CriaCerto.Client"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - criacerto-network
    restart: always

  web:
    build:
      context: .
      dockerfile: src/Web/CriaCerto.Web/CriaCerto.Web/Dockerfile
    container_name: criacerto-web
    ports:
      - "${WEB_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiBaseUrl: "http://api:8080"
    depends_on:
      - api
    networks:
      - criacerto-network
    restart: always

volumes:
  mssql-data:
    driver: local
  redis-data:
    driver: local

networks:
  criacerto-network:
    driver: bridge
