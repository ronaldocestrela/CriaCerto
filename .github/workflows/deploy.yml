name: CI/CD Build, Test & Container Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Suite of Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore Dependencies
      run: dotnet restore CriaCerto.slnx

    - name: Build Solution
      run: dotnet build CriaCerto.slnx --no-restore --configuration Release

    - name: Execute Tests
      run: dotnet test CriaCerto.slnx --no-build --configuration Release --verbosity normal

  deploy-images:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push API Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Host/CriaCerto.Api/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/criacerto-api:latest
          ghcr.io/${{ github.repository }}/criacerto-api:${{ github.sha }}

    - name: Build and Push Web Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Web/CriaCerto.Web/CriaCerto.Web/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/criacerto-web:latest
          ghcr.io/${{ github.repository }}/criacerto-web:${{ github.sha }}
